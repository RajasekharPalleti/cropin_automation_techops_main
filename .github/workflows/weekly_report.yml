name: Weekly Report

on:
  schedule:
    - cron: '35 13 * * 5' # Runs at 13:35 UTC (7:05 PM IST) every Friday
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute: "send" triggers email, "fetch" tests without sending'
        required: true
        default: 'send'
        type: choice
        options:
          - 'send'
          - 'fetch'

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Configuration File
        run: |
          mkdir -p json_config
          echo '${{ secrets.WEEKLY_REPORT_CONFIG }}' > json_config/weekly_report_config.json
          
      - name: Execute Weekly Report
        run: python run_weekly_report.py "${{ github.event.inputs.action || 'send' }}"

      - name: Commit updated history
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add json_config/weekly_report_history.json
          git diff --staged --quiet || (git commit -m "Auto-update weekly report history [skip ci]" && git push)
